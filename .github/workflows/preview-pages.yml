name: Publish bright-garden Pages preview

on:
  push:
    branches: [bright-garden]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bright-garden-pages-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bright-garden
        uses: actions/checkout@v4
        with:
          ref: bright-garden
          path: preview-src

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: dest

      - name: Stage preview under /bright-garden
        run: |
          set -euo pipefail
          rm -rf dest/bright-garden
          mkdir -p dest/bright-garden
          cd preview-src
          cp -a index.html ../dest/bright-garden/
          for d in css js lib modules airport; do
            if [ -d "$d" ]; then
              cp -a "$d" ../dest/bright-garden/
            fi
          done
          touch ../dest/bright-garden/.nojekyll
          cat > ../dest/bright-garden/README.md <<'EOF'
          # bright-garden preview

          Auto-published snapshot of the `bright-garden` branch.
          Live URL: https://dad2lna-coder.github.io/BLADE_Alpha/bright-garden/
          Do not edit these files on `main` by hand.
          EOF
          # Make the README trim leading spaces from the heredoc indent
          sed -i 's/^          //' ../dest/bright-garden/README.md
          ls -la ../dest/bright-garden

      - name: Commit preview to main
        run: |
          set -euo pipefail
          cd dest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bright-garden
          if git diff --cached --quiet; then
            echo "No preview changes to publish"
            exit 0
          fi
          git commit -m "Publish bright-garden GitHub Pages preview"
          git push origin HEAD:main
