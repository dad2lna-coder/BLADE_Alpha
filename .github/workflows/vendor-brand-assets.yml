name: Vendor brand assets

on:
  workflow_dispatch:
  push:
    branches: [bright-garden]

permissions:
  contents: write

concurrency:
  group: vendor-brand-assets
  cancel-in-progress: true

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bright-garden
      - name: Copy DAL mark and TSA seal from let-them-cook main
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fsSL -o assets/dal-mark.png https://raw.githubusercontent.com/dad2lna-coder/let-them-cook/main/assets/dal-mark.png
          curl -fsSL -o assets/tsa-seal.png https://raw.githubusercontent.com/dad2lna-coder/let-them-cook/main/assets/tsa-seal.png
          python3 - <<'PY'
          import pathlib
          for name in ("dal-mark.png", "tsa-seal.png"):
              data = pathlib.Path("assets", name).read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{name} is not a PNG")
              print(name, len(data))
          PY
      - name: Commit assets if missing or changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dal-mark.png assets/tsa-seal.png
          if git diff --cached --quiet; then
            echo "assets unchanged"
          else
            git commit -m "chore(assets): copy DAL mark and TSA seal from let-them-cook"
            git push origin HEAD:bright-garden
          fi
