</head>
<body class="console-skin">
<div id="blade-intro-root"></div>
<div id="blade-header-root"></div>
<div id="blade-status-root"></div>
<nav class="tabs" id="blade-tabs"></nav>
<main id="blade-panels"></main>
<div id="shift-day-times-modal" class="modal"><div class="modal-content"><span class="modal-close" id="shift-day-times-close">&times;</span><div class="modal-header"><h2 class="modal-title" id="shift-day-times-title">Day times</h2></div><table class="data-table"><thead><tr><th>Day</th><th></th><th>Seg 1 Start</th><th>Seg 1 End</th><th>Seg 2 Start</th><th>Seg 2 End</th><th>Duration</th></tr></thead><tbody id="shift-day-times-tbody"></tbody></table><div class="toolbar" style="margin-top:1rem"><button type="button" class="btn" id="btn-sdt-clear">Clear all overrides</button><button type="button" class="btn btn-amber" id="btn-sdt-save">Save</button><button type="button" class="btn" id="btn-sdt-cancel">Cancel</button></div></div></div>
<div id="team-detail-modal" class="modal"><div class="modal-content"><span class="modal-close" id="team-detail-close">&times;</span><div class="modal-header"><h2 class="modal-title" id="team-detail-title">Team Details</h2></div><div id="team-detail-content"></div></div></div>
<div id="instructions-modal" class="modal"><div class="modal-content"><span class="modal-close" id="instructions-modal-close">&times;</span><div class="modal-header"><h2 class="modal-title">Instructions</h2></div><div id="instructions-content" class="instructions-container" style="max-height:70vh;overflow:auto;white-space:pre-wrap"></div></div></div>

<img class="pres-seal" src="assets/tsa-seal.png" alt="" aria-hidden="true" />
<div id="blade-footer-root"></div>
<script src="lib/luxon.min.js?v=20260902i"></script>
<script src="lib/Sortable.min.js?v=20260902i"></script>
<script src="lib/exceljs.min.js?v=20260902i"></script>
<script src="lib/xlsx.full.min.js?v=20261013a"></script>
<script src="js/constants.js?v=20260923b"></script>
<script src="js/utils.js?v=20260923c"></script>
<script src="js/utils/theme.js?v=20260924d"></script>
<script src="js/io.js?v=20260924c"></script>
<script src="js/instructions.js?v=20260903a"></script>
<script src="js/main.js?v=20260924c"></script>
<script src="js/console-chrome.js?v=20260924c"></script>
<script src="js/intro.js?v=20260905g"></script>
<script type="module" src="modules/shell/dist/shell.js"></script>

<script type="module">
(async () => {
  let manifest = {};
  try {
    const resp = await fetch("modules/manifest.json");
    if (!resp.ok) throw new Error("manifest " + resp.status);
    manifest = await resp.json();
  } catch (e) {
    console.warn("manifest", e);
    return;
  }

  const Scheduler = await new Promise((resolve) => {
    (function check() {
      if (window.Scheduler) resolve(window.Scheduler);
      else setTimeout(check, 50);
    })();
  });

  function tabModules(man) {
    const list = [];
    for (const [name, raw] of Object.entries(man)) {
      const cfg = typeof raw === "string" ? { entry: raw } : (raw || {});
      const tab = cfg.tab;
      if (!tab || !tab.id) continue;
      list.push({
        name,
        cfg,
        id: String(tab.id),
        label: String(tab.label || tab.id).toUpperCase(),
        priority: Number(tab.priority) || 99,
        order: Number(tab.order) || 99
      });
    }
    list.sort(function (a, b) {
      if (a.priority !== b.priority) return a.priority - b.priority;
      if (a.order !== b.order) return a.order - b.order;
      return a.name.localeCompare(b.name);
    });
    return list;
  }

  function buildNav(entries) {
    const nav = document.getElementById("blade-tabs") || document.querySelector("nav.tabs");
    const host = document.getElementById("blade-panels") || document.querySelector("main");
    if (!host) return [];
    const shellOwnsNav = !!(Scheduler.shell && nav);
    if (nav && !shellOwnsNav) nav.innerHTML = "";
    host.innerHTML = "";
    const tabs = [];
    entries.forEach(function (entry, i) {
      const n = i + 1;
      const fkey = "F" + n;
      if (nav && !shellOwnsNav) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab-btn" + (i === 0 ? " active" : "");
        btn.dataset.tab = entry.id;
        btn.dataset.fkey = fkey;
        btn.textContent = "[" + fkey + "] " + entry.label;
        nav.appendChild(btn);
      }

      const panel = document.createElement("section");
      panel.className = "panel" + (i === 0 ? " active" : "");
      panel.id = "tab-" + entry.id;
      host.appendChild(panel);

      if (entry.cfg.panel && !entry.cfg.mount) entry.cfg.mount = "#tab-" + entry.id;
      tabs.push({ id: entry.id, label: entry.label, fkey: fkey, name: entry.name });
    });
    Scheduler.navTabs = tabs;
    if (Scheduler.shell) Scheduler.shell.setTabs(tabs);
    else {
      const hint = document.getElementById("console-nav-hint");
      if (hint) {
        hint.textContent = tabs.length
          ? "NAV: " + tabs[0].fkey + (tabs.length > 1 ? "-" + tabs[tabs.length - 1].fkey : "")
          : "NAV: -";
      }
    }
    return tabs;
  }

  function reportSubModules(man) {
    const list = [];
    for (const [name, raw] of Object.entries(man)) {
      const cfg = typeof raw === "string" ? {} : (raw || {});
      const sub = cfg.reportsSubTab;
      if (!sub || !sub.id) continue;
      list.push({
        name,
        cfg,
        id: String(sub.id),
        label: String(sub.label || sub.id),
        order: Number(sub.order) || 99
      });
    }
    list.sort(function (a, b) {
      if (a.order !== b.order) return a.order - b.order;
      return a.name.localeCompare(b.name);
    });
    return list;
  }

  function buildReportHost(subs) {
    const tab = document.getElementById("tab-reports");
    if (!tab) {
      Scheduler.reportSubTabs = [];
      return [];
    }
    tab.innerHTML = "";
    const nav = document.createElement("nav");
    nav.className = "tabs report-subtabs";
    nav.id = "report-subtabs";
    const panels = document.createElement("div");
    panels.id = "report-sub-panels";
    tab.appendChild(nav);
    tab.appendChild(panels);
    const out = [];
    subs.forEach(function (entry, i) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "report-sub-btn" + (i === 0 ? " active" : "");
      btn.dataset.subtab = entry.id;
      btn.textContent = entry.label;
      nav.appendChild(btn);

      const panel = document.createElement("section");
      panel.className = "report-sub-panel" + (i === 0 ? " active" : "");
      panel.id = "report-sub-" + entry.id;
      panels.appendChild(panel);

      if (!entry.cfg.reportsMount) entry.cfg.reportsMount = "#report-sub-" + entry.id;
      if (!entry.cfg.reportsPanel && entry.cfg.panel && (!entry.cfg.mount || String(entry.cfg.mount).indexOf("report-sub") !== -1 || entry.cfg.mount === "#tab-demand-capacity")) {
        entry.cfg.mount = "#report-sub-" + entry.id;
      }
      out.push({ id: entry.id, label: entry.label, name: entry.name, order: entry.order });
    });
    Scheduler.reportSubTabs = out;
    if (out.length) Scheduler.reportSubTab = out[0].id;
    Scheduler.switchReportSub = Scheduler.switchReportSub || function (id) {
      Scheduler.reportSubTab = id;
      document.querySelectorAll("#report-subtabs .report-sub-btn").forEach(function (b) {
        b.classList.toggle("active", b.dataset.subtab === id);
      });
      document.querySelectorAll("#report-sub-panels .report-sub-panel").forEach(function (p) {
        p.classList.toggle("active", p.id === "report-sub-" + id);
      });
    };
    return out;
  }

  const ownedTabs = tabModules(manifest);
  buildNav(ownedTabs);
  buildReportHost(reportSubModules(manifest));

  for (const [name, raw] of Object.entries(manifest)) {
    const cfg = typeof raw === "string" ? { entry: raw, init: "initTeamBuilder" } : raw;
    try {
      for (const href of cfg.css || []) {
        if (document.querySelector(`link[data-module-css="${href}"]`)) continue;
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = href;
        link.dataset.moduleCss = href;
        document.head.appendChild(link);
      }

      if (cfg.panel && cfg.mount) {
        const mount = document.querySelector(cfg.mount);
        if (mount && !(cfg.mount === "#tab-reports" && document.getElementById("report-subtabs"))) {
          const r = await fetch(cfg.panel);
          if (r.ok) mount.innerHTML = await r.text();
        }
      }

      if (cfg.reportsPanel && cfg.reportsMount) {
        const subMount = document.querySelector(cfg.reportsMount);
        if (subMount) {
          const r = await fetch(cfg.reportsPanel);
          if (r.ok) subMount.innerHTML = await r.text();
        }
      }

      if (cfg.docks && !document.getElementById("team-follow-docks")) {
        const r = await fetch(cfg.docks);
        if (r.ok) document.body.insertAdjacentHTML("beforeend", await r.text());
      }

      if (!cfg.entry) continue;
      const mod = await import(new URL(cfg.entry, window.location.href).href);
      const initFn = mod[cfg.init] || mod.init || mod.initTeamBuilder;
      if (typeof initFn === "function") initFn(Scheduler);
      else console.warn(name, "no init");
    } catch (err) {
      console.warn("module", name, err);
    }
  }

  if (typeof Scheduler.hookConsoleIo === "function") Scheduler.hookConsoleIo();
})();
</script>
</body>
</html>
