    <!-- 
    MODIFICATION: Load the new Team Builder module and initialize it.
    The old <script src="js/team-core.js"></script> has been removed.
    -->
    <script type="module">
        // First, import the public init function from our new module's entry point.
        import { initTeamBuilder } from './team-builder/index.js';

        // The main application creates a global `Scheduler` object.
        // We wait for the DOM to be ready, then pass that object to our module.
        document.addEventListener('DOMContentLoaded', () => {
            if (window.Scheduler) {
                initTeamBuilder(window.Scheduler);
            } else {
                console.error("Fatal: Main Scheduler object not found. Team Builder could not be initialized.");
            }
        });
    </script>
