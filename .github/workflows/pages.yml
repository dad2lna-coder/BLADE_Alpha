name: Deploy GitHub Pages

on:
  push:
    branches: [bright-garden]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bright-garden
        uses: actions/checkout@v4
        with:
          ref: bright-garden

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a index.html _site/
          for d in css js lib modules airport; do
            if [ -d "$d" ]; then cp -a "$d" _site/; fi
          done
          touch _site/.nojekyll
          printf '%s\n' 'bright-garden' > _site/PAGES_SOURCE.txt
          ls -la _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
