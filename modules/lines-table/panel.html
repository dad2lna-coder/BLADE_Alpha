<div class="card">
  <div class="section-title">Bid lines</div>
  <div id="lines-table-root"></div>
  <div class="toolbar" id="lines-toolbar">
    <label>Filter role <select id="lines-filter-role"><option value="ALL" selected>All</option><option value="STSO">STSO</option><option value="LTSO">LTSO</option><option value="TSO">TSO (FT/PT)</option></select></label>
    <label>Filter shift <select id="lines-filter-shift"><option value="">All shifts</option></select></label>
    <label>Filter sex <select id="lines-filter-sex"><option value="">All</option><option value="M">M</option><option value="F">F</option></select></label>
    <label>Filter team <select id="lines-filter-team"><option value="">All</option><option value="__none__">Unassigned</option></select></label>
    <button type="button" class="btn btn-amber" id="btn-export-lines-excel">Export Excel (.xlsx)</button>
  </div>
</div>
