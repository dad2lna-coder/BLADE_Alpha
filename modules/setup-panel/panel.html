<div class="card" id="setup-io-toolbar">
<div class="toolbar setup-io-row">
<button type="button" class="btn btn-amber" id="btn-generate">[GEN] GENERATE</button>
<button type="button" class="btn" id="btn-export">[EXP] EXPORT</button>
<button type="button" class="btn" id="btn-import">[IMP] IMPORT</button>
<button type="button" class="btn btn-red" id="btn-clear">[CLR] CLEAR</button>
<input type="file" id="file-import" accept="application/json,.json" style="display:none" />
</div>
</div>
<div class="card"><div class="section-title">What this is</div><p class="muted" style="margin:0"><strong>BLADE</strong> staffing balancer. <strong>FT / PT</strong> are operational TSO. <strong>LTSO/STSO M/F</strong> are management.</p></div>
<input type="hidden" id="cfg-open" value="03:30" /><input type="hidden" id="cfg-close" value="23:00" />
<div class="card" id="card-period"><div class="section-title">Schedule period</div><div class="period-row" style="display:flex;flex-wrap:wrap;gap:1rem;align-items:center"><label>Schedule start <input type="date" id="cfg-start" /></label><label>Weeks <input type="number" id="cfg-weeks" min="1" max="8" value="1" style="width:4.5rem" /></label></div></div>
<details class="card setup-fold" id="card-fte"><summary class="section-title">FTE</summary>
<div class="fte-block">
<div class="fte-role" style="text-align:center;font-weight:700;margin:0.85rem 0 0.35rem">FT TSO</div>
<div class="fte-sex-row" style="display:flex;justify-content:center;gap:2rem;flex-wrap:wrap"><label>Male <input type="number" id="cfg-ft-m" min="0" value="10" style="width:4.5rem" /></label><label>Female <input type="number" id="cfg-ft-f" min="0" value="10" style="width:4.5rem" /></label></div>
<div class="fte-role" style="text-align:center;font-weight:700;margin:0.85rem 0 0.35rem">PT TSO</div>
<div class="fte-sex-row" style="display:flex;justify-content:center;gap:2rem;flex-wrap:wrap"><label>Male <input type="number" id="cfg-pt-m" min="0" value="4" style="width:4.5rem" /></label><label>Female <input type="number" id="cfg-pt-f" min="0" value="4" style="width:4.5rem" /></label></div>
<div class="fte-role" style="text-align:center;font-weight:700;margin:0.85rem 0 0.35rem">LTSO</div>
<div class="fte-sex-row" style="display:flex;justify-content:center;gap:2rem;flex-wrap:wrap"><label>Male <input type="number" id="cfg-ltso-m" min="0" value="1" style="width:4.5rem" /></label><label>Female <input type="number" id="cfg-ltso-f" min="0" value="1" style="width:4.5rem" /></label></div>
<div class="fte-role" style="text-align:center;font-weight:700;margin:0.85rem 0 0.35rem">STSO</div>
<div class="fte-sex-row" style="display:flex;justify-content:center;gap:2rem;flex-wrap:wrap"><label>Male <input type="number" id="cfg-stso-m" min="0" value="2" style="width:4.5rem" /></label><label>Female <input type="number" id="cfg-stso-f" min="0" value="2" style="width:4.5rem" /></label></div>
<div class="toolbar" style="margin-top:0.75rem;gap:0.5rem;flex-wrap:wrap"><button type="button" class="btn" id="btn-add-position">+ Add position</button><button type="button" class="btn btn-amber" id="btn-save-staffing">Save staffing</button></div>
<div id="extra-pos-list" class="extra-pos-list"></div>
</div>
</details>
