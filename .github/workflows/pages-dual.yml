name: Dual GitHub Pages

on:
  push:
    branches: [main, bright-garden]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: src-main

      - name: Checkout bright-garden
        uses: actions/checkout@v4
        with:
          ref: bright-garden
          path: src-bg

      - name: Assemble both sites
        run: |
          set -euo pipefail
          mkdir -p site/bright-garden

          copy_app() {
            local from="$1"
            local to="$2"
            mkdir -p "$to"
            cp -a "$from/index.html" "$to/"
            for d in css js lib modules airport; do
              if [ -d "$from/$d" ]; then cp -a "$from/$d" "$to/"; fi
            done
            touch "$to/.nojekyll"
          }

          copy_app src-main site
          copy_app src-bg site/bright-garden
          printf '%s\n' 'main' > site/PAGES_SOURCE.txt
          printf '%s\n' 'bright-garden' > site/bright-garden/PAGES_SOURCE.txt
          ls -la site site/bright-garden

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
